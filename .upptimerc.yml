owner: manarhq
repo: status

sites:
  - name: Website
    url: https://manar.vax.sh/en
    expectedStatusCodes:
      - 200
  - name: Console
    url: https://console-manar.vax.sh/en/login
    expectedStatusCodes:
      - 200
  - name: Sign-in
    url: https://auth-manar.vax.sh/realms/manar/.well-known/openid-configuration
    expectedStatusCodes:
      - 200
  - name: API (via console)
    url: https://console-manar.vax.sh/billing/stripe/webhook
    method: POST
    headers:
      - "Content-Type: application/json"
    body: "{}"
    expectedStatusCodes:
      - 400
  - name: MCP
    url: https://mcp-manar.vax.sh/mcp/x/y
    method: POST
    headers:
      - "Content-Type: application/json"
    body: "{}"
    expectedStatusCodes:
      - 401
  - name: Device installer
    url: https://console-manar.vax.sh/i/uninstall.sh
    expectedStatusCodes:
      - 200

status-website:
  cname: status-manar.fixio.ae
  logoUrl: https://raw.githubusercontent.com/manarhq/status/main/assets/manar-icon.png
  faviconSvg: https://raw.githubusercontent.com/manarhq/status/main/assets/manar-icon.png
  name: Manar status
  introTitle: "**Manar** service status"
  introMessage: Live status of Manar services, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: Manar
      href: https://manar.vax.sh
